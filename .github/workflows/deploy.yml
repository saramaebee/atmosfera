name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - run: bun install
      - run: bun run typecheck
      - run: bun x biome check .
      - run: bun test

  deploy:
    name: Deploy to GCE
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd "$HOME/atmosfera"
            git fetch origin main
            git reset --hard origin/main
            "$HOME/.bun/bin/bun" install --production
            sudo /bin/systemctl restart atmosfera
            # atmosfera-web is optional — only restart if it's installed.
            if systemctl list-unit-files atmosfera-web.service >/dev/null 2>&1; then
              sudo /bin/systemctl restart atmosfera-web
            fi
            # Brief health check: process should still be up 5 seconds later
            sleep 5
            sudo /bin/systemctl status atmosfera --no-pager | head -10
            if systemctl list-unit-files atmosfera-web.service >/dev/null 2>&1; then
              sudo /bin/systemctl status atmosfera-web --no-pager | head -10
            fi
